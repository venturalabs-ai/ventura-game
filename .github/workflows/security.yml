name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=.github -e 'AKIA[0-9A-Z]{16}' -e 'ghp_[A-Za-z0-9]{36}' -e 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' . ; then
            echo 'Possible secret material detected' >&2
            exit 1
          fi
      - name: Reject unsupported absolute claims
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          for path in README.md .opencode docs; do
            if [[ -e "$path" ]]; then
              paths+=("$path")
            fi
          done
          if ((${#paths[@]})) && grep -RInEi -e '100% seguro' -e 'zero vulnerabilidades' -e 'zero hallucinations' "${paths[@]}"; then
            echo 'Unsupported absolute claim detected' >&2
            exit 1
          fi
